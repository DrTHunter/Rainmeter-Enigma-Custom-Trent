;-----------------------
; SCROLL ARROWS
; Shown only when the feed has more events than fit on screen.
; Marlett glyphs: 5 = up arrow, 6 = down arrow.

[MeasureGcalScrollable]
Measure=Calc
Formula=#NumberOfItems#
DynamicVariables=1
Group=FeedData
IfCondition=MeasureGcalScrollable > 4
IfTrueAction=[!ShowMeter "GcalScrollUp"][!ShowMeter "GcalScrollDown"][!Redraw]
IfFalseAction=[!HideMeter "GcalScrollUp"][!HideMeter "GcalScrollDown"][!Redraw]

[GcalScrollUp]
Meter=STRING
Text=5
FontFace=Marlett
FontSize=9
FontColor=154,160,166,170
X=(#SidebarWidth#-20)
Y=44
W=14
H=12
AntiAlias=1
DynamicVariables=1
Hidden=1
LeftMouseUpAction=!CommandMeasure "MeasureScriptReader" "Scroll(-1)"
MouseScrollUpAction=!CommandMeasure "MeasureScriptReader" "Scroll(-1)"
MouseScrollDownAction=!CommandMeasure "MeasureScriptReader" "Scroll(1)"

[GcalScrollDown]
Meter=STRING
Text=6
FontFace=Marlett
FontSize=9
FontColor=154,160,166,170
X=(#SidebarWidth#-20)
Y=180
W=14
H=12
AntiAlias=1
DynamicVariables=1
Hidden=1
LeftMouseUpAction=!CommandMeasure "MeasureScriptReader" "Scroll(1)"
MouseScrollUpAction=!CommandMeasure "MeasureScriptReader" "Scroll(-1)"
MouseScrollDownAction=!CommandMeasure "MeasureScriptReader" "Scroll(1)"

