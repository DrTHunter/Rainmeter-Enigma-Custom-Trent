;---------------------------------------------------------------------
; ENIGMA READER

[Rainmeter]
Author=Kaelri

[Variables]
@include=#@#User\Options.inc

;---------------------------------------------------------------------
; STYLES

@include2=#@#Styles\#Stylesheet#\Options.inc
@include3=#@#Styles\#Stylesheet#\SidebarCommon.inc
@include4=#@#Styles\#Stylesheet#\SidebarReader.inc

;---------------------------------------------------------------------
; METERS & MEASURES

@include5=#ROOTCONFIGPATH#Sidebar\Reader\Reader.inc
NumberOfTabs=5
ReaderURL1=#Feed1#
ReaderURL2=#Feed2#
ReaderURL3=#Feed3#
ReaderURL4=#Feed4#
ReaderURL5=#Feed5#
ReaderIconStyle=StyleReaderIcon
; News moves slowly enough that 30 minutes is plenty; 600 was three
; network wake-ups per feed per half hour for headlines that rarely change.
ReaderUpdateRate=1800

@include6=#@#Measures\Switcher.inc
SwitcherInterval=#TriptychInterval#
SwitcherAction=!CommandMeasure "MeasureScriptReader" "ShowNext()"
SwitcherDisabled=#TriptychDisabled#

;---------------------------------------------------------------------
; NUMBERED HEADLINES
; These sections re-open meters and styles defined in the included
; files; options here take precedence. Headlines wrap to as many
; lines as they need (ClipString=2, auto height), so only four fit
; in the box; items 5-8 are hidden. The feed still holds ten stories,
; so the remainder can be reached by scrolling over the skin. Item
; heights are fixed so the box keeps a constant size and the tab
; grabbers stay pinned to the bottom edge.

[MeasureScriptReader]
MinItems=4
MaxItems=10
StripTitleSource=1

[StyleReaderText]
ClipString=2
H=25
Y=30r
MouseScrollUpAction=!CommandMeasure "MeasureScriptReader" "Scroll(-1)"
MouseScrollDownAction=!CommandMeasure "MeasureScriptReader" "Scroll(1)"

[Background]
MouseScrollUpAction=!CommandMeasure "MeasureScriptReader" "Scroll(-1)"
MouseScrollDownAction=!CommandMeasure "MeasureScriptReader" "Scroll(1)"

[Icon]
MouseScrollUpAction=!CommandMeasure "MeasureScriptReader" "Scroll(-1)"
MouseScrollDownAction=!CommandMeasure "MeasureScriptReader" "Scroll(1)"

[Title]
MouseScrollUpAction=!CommandMeasure "MeasureScriptReader" "Scroll(-1)"
MouseScrollDownAction=!CommandMeasure "MeasureScriptReader" "Scroll(1)"

[Item1]
Text=#Item1Number#.  #Item1Title#
ToolTipText=#Item1Title#

[Item2]
Text=#Item2Number#.  #Item2Title#
ToolTipText=#Item2Title#

[Item3]
Text=#Item3Number#.  #Item3Title#
ToolTipText=#Item3Title#

[Item4]
Text=#Item4Number#.  #Item4Title#
ToolTipText=#Item4Title#

[Item5]
Hidden=1
H=0
Y=0R

[Item6]
Hidden=1
H=0
Y=0R

[Item7]
Hidden=1
H=0
Y=0R

[Item8]
Hidden=1
H=0
Y=0R

[BorderBottom]
Y=162

[Grabber1]
X=(#SidebarWidth#-(#NumberOfTabs#*15)-10)
Y=159

[Grabber2]
X=R
Y=159

[Grabber3]
X=R
Y=159

[Grabber4]
X=R
Y=159

[Grabber5]
X=R
Y=159

;---------------------------------------------------------------------
; METADATA

[Metadata]
Name=Enigma Reader
Information=Shows your Atom and RSS feeds in rotating tabs. | · To add another tab, change the "NumberOfTabs" variable from "3" to "4", then add a new variable called "ReaderURL4", with your new feed URL as the value. You can show up to eight tabs.
