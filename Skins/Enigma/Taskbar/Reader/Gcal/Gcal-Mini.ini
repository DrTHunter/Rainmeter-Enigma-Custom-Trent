ReaderURL=#GoogleCalendar1#
ReaderIconStyle=StyleGcalIcon
; Sidebar\Reader\Gcal owns GoogleCalendar1.xml; both writing it meant
; two skins overwriting the cache Sidebar\Calendar reads.
ReaderWriteEvents=0
ReaderEventFile=#@#User\Calendars\GoogleCalendar1.xml
Variant=Mini

