;---------------------------------------------------------------------
; ENIGMA SEARCH (1) (ICON-ONLY)

[Rainmeter]
Author=Kaelri

[Variables]
@include=#@#User\Options.inc

;---------------------------------------------------------------------
; STYLES

@include2=#@#Styles\#Stylesheet#\Options.inc
@include3=#@#Styles\#Stylesheet#\TaskbarCommon.inc

;---------------------------------------------------------------------
; METERS

@include4=#ROOTCONFIGPATH#Taskbar\Search\Search.inc
Search=#Search1#
SearchIcon=#Search1Icon#
Variant=IconOnly
SearchBoxWidth=200

;---------------------------------------------------------------------
; MEASURES

[MeasureSearch]
Measure=PLUGIN
Plugin=InputText
UpdateDivider=-1
Command1=["#Search1Command#"] DefaultValue="Search #Search1#"
FocusDismiss=1
; Centred on the icon, which sits at X=5 and is 25 wide (centre 17.5), and
; vertically in the bar. The stock box was 60 px wide starting at X=5, so it
; hung off to the right of the icon and clipped "Search Google" to "Search".
X=(17.5 - #SearchBoxWidth# / 2)
Y=((#TaskbarHeight# - 20) / 2)
W=#SearchBoxWidth#
H=20
StringAlign=Center
FontFace=#Font#
FontSize=#Size1#
FontColor=#ColorBorder#
SolidColor=#ColorPanel#

;---------------------------------------------------------------------
; METADATA

[Metadata]
Name=Enigma Search (1) (IconOnly)
Information=Shows your chosen search engine. | · Click the skin to type your search.
Version=4 Patch 1
