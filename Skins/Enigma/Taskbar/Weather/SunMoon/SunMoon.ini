;---------------------------------------------------------------------
; ENIGMA SUN & MOON (ICON)
;
; Sunrise, Sunset and Moon were three separate configs sitting side by
; side on the taskbar at X=0, 80 and 164. Sunrise and Sunset each
; included @Resources\Measures\YahooWeather.inc, and since Rainmeter
; cannot share measures across configs that meant two independent sets
; of calls to the weather API for two values that come out of the same
; parent measure -- [MeasureYahooWeather] StringIndex 6 and 7.
;
; Merging them into one config collapses that to a single include, so
; the strip makes one pair of API calls instead of two. Moon is carried
; along because it belongs with the other two visually and costs
; nothing: its phase is arithmetic on the current date and it never
; touched the network at all.
;
; Two things worth knowing if you edit this:
;
; 1. Meter names are prefixed per group. The original Sunrise.inc,
;    Sunset.inc and Moon.inc each declared [Background], [Icon], [Text]
;    and [Label], so including all three together would have collapsed
;    three displays into one set of meters.
;
; 2. Block widths are fixed rather than measured. TaskbarSkinWidth.lua
;    sizes a skin by reading the meters literally named 'Text' and
;    'Label' and setting one skin-wide variable, which cannot describe
;    three blocks. It is disabled below and the widths are pinned to
;    what the Lua produced before (min width 60 + 40 padding = 100).
;    The boxes overlap slightly at these offsets, exactly as they did
;    as separate skins. The tradeoff is that the Moon box no longer
;    shrinks for a short phase name like "Full"; its text clips instead.

[Rainmeter]
Author=Kaelri

[Variables]
@include=#@#User\Options.inc

;---------------------------------------------------------------------
; STYLES

@include2=#@#Styles\#Stylesheet#\Options.inc
@include3=#@#Styles\#Stylesheet#\TaskbarCommon.inc
Variant=Icon

;---------------------------------------------------------------------
; SHARED WEATHER MEASURES
;
; Included once for the whole strip. This single include is the point
; of the merge.

@include4=#@#Measures\YahooWeather.inc
CurrentCode=#WeatherCode#
CurrentCodeName=#WeatherCodeName#
CurrentCodeLat=#WeatherCodeLat#
CurrentCodeLon=#WeatherCodeLon#

;---------------------------------------------------------------------
; LAYOUT
; Offsets reproduce the original standalone window positions.

BlockSunriseX=0
BlockSunsetX=80
BlockMoonX=164

; Measured from the standalone skins' own window rects before the merge:
; Sunrise and Sunset were 100x44, Moon 121x44.
BlockW=100
BlockMoonW=121

;---------------------------------------------------------------------
; MEASURES
;
; TaskbarSkinWidth.lua calls SKIN:GetMeter('Text') and GetMeter('Label')
; in Initialize and dereferences them every Update. Neither name exists
; here, so it is disabled to keep it from erroring once per second.

[MeasureTaskbarSkinWidth]
Disabled=1

;-----------------------
; MOON PHASE
; Days since Y2K -> position in the 29.53-day synodic cycle, quantised
; to 16 steps. Carried over unchanged from Moon.inc.

[MeasureDay]
Measure=Time
Format=%d

[MeasureMonth]
Measure=Time
Format=%m

[MeasureYear]
Measure=Time
Format=%Y

[MeasureDaysSinceY2K]
Measure=Calc
Formula=FLOOR((MeasureYear-2000)*365.2425)+(MeasureMonth>1)*31+(MeasureMonth>2)*(28+((MeasureYear%4)=0))+(MeasureMonth>3)*31+(MeasureMonth>4)*30+(MeasureMonth>5)*31+(MeasureMonth>6)*30+(MeasureMonth>7)*31+(MeasureMonth>8)*31+(MeasureMonth>9)*30+(MeasureMonth>10)*31+(MeasureMonth>11)*30+(MeasureMonth>12)*31+MeasureDay

[MeasureMoonText]
Measure=Calc
Formula=ROUND(16*FRAC(((-29.5305888531)+SQRT((29.5305888531)**2-4*(102.19*(10**(-12)))*(20.362954-MeasureDaysSinceY2K)))/(2*(102.19*(10**(-12))))))%16
Substitute="10":"Waxing Crescent","11":"Waxing Crescent","12":"First Quarter","13":"Waxing Gibbous","14":"Waxing Gibbous","15":"Waxing Gibbous","0":"Full","1":"Waning Gibbous","2":"Waning Gibbous","3":"Waning Gibbous","4":"Last Quarter","5":"Waning Crescent","6":"Waning Crescent","7":"Waning Crescent","8":"New","9":"Waxing Crescent"

[MeasureMoonOverlay]
Measure=Calc
Formula=ROUND(16*FRAC(((-29.5305888531)+SQRT((29.5305888531)**2-4*(102.19*(10**(-12)))*(20.362954-MeasureDaysSinceY2K)))/(2*(102.19*(10**(-12))))))%16
Substitute=".00000":""

;---------------------------------------------------------------------
; SUNRISE
;
; Each group overrides only X on Background, Icon and Text. Label keeps
; the stylesheet's X=r / Y=R, which puts it directly under the Text
; meter defined immediately above it -- so group order matters here.

[SunriseBackground]
Meter=Image
MeterStyle=StyleIconBackground
X=#BlockSunriseX#
W=#BlockW#

[SunriseIcon]
Meter=Image
MeterStyle=StyleIconIcon | StyleSunIcon
X=(#BlockSunriseX#+5)

[SunriseText]
Meter=STRING
MeterStyle=StyleIconText
MeasureName=MeasureWeatherSunrise
X=(#BlockSunriseX#+35)

[SunriseLabel]
Meter=STRING
MeterStyle=StyleIconLabel
Text=RISE

;---------------------------------------------------------------------
; SUNSET

[SunsetBackground]
Meter=Image
MeterStyle=StyleIconBackground
X=#BlockSunsetX#
W=#BlockW#

[SunsetIcon]
Meter=Image
MeterStyle=StyleIconIcon | StyleSunIcon
X=(#BlockSunsetX#+5)

[SunsetText]
Meter=STRING
MeterStyle=StyleIconText
MeasureName=MeasureWeatherSunset
X=(#BlockSunsetX#+35)

[SunsetLabel]
Meter=STRING
MeterStyle=StyleIconLabel
Text=SET

;---------------------------------------------------------------------
; MOON
;
; The overlay image is picked by MeasureMoonOverlay's 0-15 value via the
; %1 placeholder in StyleMoonIconOverlay, drawn on top of the base disc.

[MoonBackground]
Meter=Image
MeterStyle=StyleIconBackground
X=#BlockMoonX#
W=#BlockMoonW#

[MoonIcon]
Meter=IMAGE
MeterStyle=StyleIconIcon | StyleMoonIcon
X=(#BlockMoonX#+5)

[MoonIconOverlay]
Meter=IMAGE
MeterStyle=StyleIconIcon | StyleMoonIconOverlay
MeasureName=MeasureMoonOverlay
X=(#BlockMoonX#+5)

[MoonText]
Meter=STRING
MeterStyle=StyleIconText
MeasureName=MeasureMoonText
X=(#BlockMoonX#+35)
W=(#BlockMoonW#-40)
ClipString=1

[MoonLabel]
Meter=STRING
MeterStyle=StyleIconLabel
Text="LUNA"

;---------------------------------------------------------------------
; METADATA

[Metadata]
Name=Enigma Sun & Moon (Icon)
Information=Sunrise, sunset and moon phase in one strip, sharing a single set of weather API calls. Replaces the separate Sunrise, Sunset and Moon skins. | Adapted from the originals by Kaelri, Kenz0, gschoppe, benjam and jER.
