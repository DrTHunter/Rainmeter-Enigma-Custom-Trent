;---------------------------------------------------------------------
; ENIGMA CALENDAR PROVIDER
;
; The single network call point for the primary Google Calendar feed.
;
; Sidebar\Reader\Gcal and Taskbar\Reader\Gcal both pulled
; #GoogleCalendar1# on their own timers, and because both ran Reader.lua
; with WriteEvents enabled they also both wrote
; User\Calendars\GoogleCalendar1.xml -- two skins taking turns
; overwriting the same cache that Sidebar\Calendar reads. This skin
; downloads that feed once; both display skins now parse the local copy
; through file://, and only the sidebar writes the events XML.
;
; Only calendar 1 is handled here because it is the only feed fetched
; twice. Calendars 2-8 belong to the sidebar's tab rotation, which
; fetches each one on demand -- downloading all eight here would add
; network calls rather than remove them.
;
; This skin draws nothing. It must stay loaded or the two Gcal displays
; will keep rendering the last cached copy without refreshing it.
;
; WebParser counts UpdateRate in skin updates, so Update=1000 makes
; UpdateRate=600 mean 10 minutes -- matching the cadence the Gcal skins
; used before, since calendar entries want more freshness than news.

[Rainmeter]
Update=1000

[Variables]
@include=#@#User\Options.inc

CachePath=#@#User\Cache\

;---------------------------------------------------------------------
; DOWNLOAD

[MeasureGcal1Download]
Measure=Plugin
Plugin=WebParser
Url=#GoogleCalendar1#
Download=1
DownloadFile=#CachePath#gcal1.ics
UpdateRate=600
DynamicVariables=1
FinishAction=[!CommandMeasure "MeasureFeed1" "Update" "Enigma\Sidebar\Reader\Gcal"][!CommandMeasure "MeasureFeed" "Update" "Enigma\Taskbar\Reader\Gcal"]

;---------------------------------------------------------------------
; METER
;
; Rainmeter deactivates any skin that contains no meters, so a provider
; that only holds measures needs one placeholder to stay loaded. It has
; no text and draws nothing.

[Dummy]
Meter=String

;---------------------------------------------------------------------
; METADATA

[Metadata]
Name=Enigma Calendar Provider
Information=Headless. Performs the only download of the primary Google Calendar feed and caches it for the Gcal display skins. Keep loaded.
Version=1
License=Creative Commons BY-NC-SA 3.0
