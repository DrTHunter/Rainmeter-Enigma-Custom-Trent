;---------------------------------------------------------------------
; ENIGMA WEATHER PROVIDER
;
; The single network call point for the weather.com API.
;
; Every weather display skin included @Resources\Measures\YahooWeather.inc
; directly, and Rainmeter cannot share measures between configs, so each
; one opened its own pair of HTTP requests for the same two JSON
; documents. With Sidebar\Weather, Taskbar\Weather\Sunrise and
; Taskbar\Weather\Sunset all loaded that was six requests per cycle to
; render one location's forecast.
;
; This skin owns those two requests. It downloads the raw JSON to
; @Resources\User\Cache\ and the display skins parse the local copies
; through file:// -- every RegExp and StringIndex in YahooWeather.inc is
; unchanged, only the two parent Url values differ.
;
; This skin draws nothing and has no meters. It must stay loaded: if it
; is unloaded the display skins keep rendering the last cached JSON but
; that JSON stops being refreshed.
;
; Cadence lives here and nowhere else. WebParser counts UpdateRate in
; skin updates, so Update=1000 below makes UpdateRate=1800 mean 30
; minutes.

[Rainmeter]
Update=1000

[Variables]
@include=#@#User\Options.inc

WeatherAPIKey=e1f10a1e78da46f5b10a1e78da96f525

; Enigma's #Unit# is f or c; weather.com wants e or m.
WxUnitf=e
WxUnitc=m

CachePath=#@#User\Cache\

;---------------------------------------------------------------------
; DOWNLOADS
;
; Download=1 saves the response body to DownloadFile instead of parsing
; it. FinishAction then tells each consumer to re-read its local copy,
; so a display refreshes the moment new JSON lands rather than drifting
; on its own timer. A !CommandMeasure aimed at a config that is not
; loaded is a no-op that logs a notice -- harmless, and the reason the
; consumer list is spelled out here rather than hidden in a group.

[MeasureWxCurrentDownload]
Measure=Plugin
Plugin=WebParser
Url=https://api.weather.com/v3/wx/observations/current?geocode=#WeatherCodeLat#,#WeatherCodeLon#&units=[#WxUnit[#Unit]]&language=en-US&format=json&apiKey=#WeatherAPIKey#
Download=1
DownloadFile=#CachePath#wx-current.json
UpdateRate=1800
DynamicVariables=1
FinishAction=[!CommandMeasure "MeasureYahooWeather" "Update" "Enigma\Sidebar\Weather"][!CommandMeasure "MeasureYahooWeather" "Update" "Enigma\Taskbar\Weather\Sunrise"][!CommandMeasure "MeasureYahooWeather" "Update" "Enigma\Taskbar\Weather\Sunset"]

[MeasureWxForecastDownload]
Measure=Plugin
Plugin=WebParser
Url=https://api.weather.com/v3/wx/forecast/daily/5day?geocode=#WeatherCodeLat#,#WeatherCodeLon#&units=[#WxUnit[#Unit]]&language=en-US&format=json&apiKey=#WeatherAPIKey#
Download=1
DownloadFile=#CachePath#wx-forecast.json
UpdateRate=1800
DynamicVariables=1
FinishAction=[!CommandMeasure "MeasureWeatherForecast" "Update" "Enigma\Sidebar\Weather"]

;---------------------------------------------------------------------
; METER
;
; Rainmeter deactivates any skin that contains no meters, so a provider
; that only holds measures needs one placeholder to stay loaded. It has
; no text and draws nothing. StandbyMonitors\HorzMonitor.ini carries the
; same placeholder for the same reason.

[Dummy]
Meter=String

;---------------------------------------------------------------------
; METADATA

[Metadata]
Name=Enigma Weather Provider
Information=Headless. Performs the only weather.com API calls and caches the JSON for the weather display skins to parse locally. Keep loaded.
Version=1
